# =========================
# Server Configuration
# =========================
server.port=8093
spring.application.name=cart-service

# =========================
# Redis Configuration
# =========================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# Optional Redis database index (default is 0)
spring.data.redis.database=0




# Optional: set a keyspace prefix for your microservice (useful if multiple services use same Redis)
spring.data.redis.keyspace-prefix=cart-service:

# =========================
# Logging (optional but useful for debugging)
# =========================
logging.level.org.springframework.data.redis=DEBUG



management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# AWS (SQS)
# =========================
spring.cloud.aws.region.static=us-east-1
app.sqs.queue-name=cart-queue