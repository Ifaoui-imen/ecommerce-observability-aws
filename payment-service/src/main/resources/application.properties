server.port=8097
spring.application.name=payment-service

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# AWS (SQS + EventBridge)
# =========================
spring.cloud.aws.region.static=us-east-1
app.sqs.queue-name=payment-queue
app.aws.eventbridge.bus-name=ecommerce-bus

# =========================
# Simulation du paiement
# =========================
# au-delà de ce montant : PaymentFailed systématique
app.payment.max-amount=10000
# probabilité d'échec aléatoire (0.0 = jamais, 0.3 = 30 %) - pour les tests de chaos
app.payment.failure-rate=0.0