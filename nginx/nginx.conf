events {}

http {
    # DNS interne de Docker : nginx résout les noms des services à chaque requête
    # (il démarre même si un service n'est pas encore prêt, et suit les redémarrages)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Format de log JSON (déjà dans l'esprit de l'instrumentation)
    log_format json escape=json '{"time":"$time_iso8601","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,'
                                '"upstream":"$upstream_addr","duration_s":$request_time}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    server {
        listen 80;

        # Santé du point d'entrée
        location = /health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location /api/auth {
            set $svc http://auth-service:8082;
            proxy_pass $svc;
        }

        location /api/users {
            set $svc http://user-service:8090;
            proxy_pass $svc;
        }

        location /api/products {
            set $svc http://product-service:8091;
            proxy_pass $svc;
        }

        location /api/inventory {
            set $svc http://inventory-service:8092;
            proxy_pass $svc;
        }

        # cart-service écoute /cart/... : on réécrit /api/cart/... -> /cart/...
        location /api/cart/ {
            set $svc http://cart-service:8093;      # le "set" doit être AVANT le rewrite...break
            rewrite ^/api/cart/(.*)$ /cart/$1 break;
            proxy_pass $svc;
        }

        location /api/orders {
            set $svc http://order-service:8094;
            proxy_pass $svc;
        }

        location /api/payments {
            set $svc http://payment-service:8097;
            proxy_pass $svc;
        }

        # Tout le reste : 404 en JSON
        location / {
            default_type application/json;
            return 404 '{"error":"route not found"}';
        }
    }
}