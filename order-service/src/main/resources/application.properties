server.port=8094
spring.application.name=order-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/order_service
spring.datasource.username=postgres
spring.datasource.password=@msdDhoni07

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer



management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# AWS (EventBridge)
# =========================
app.aws.region=us-east-1
# vide = vrai AWS ; surchargé en local par la variable APP_AWS_ENDPOINT
app.aws.endpoint=
app.aws.eventbridge.bus-name=ecommerce-bus