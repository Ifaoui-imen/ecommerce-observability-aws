services:

  # ================== INFRASTRUCTURE ==================

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net

  # Kafka reste pour l'instant : il sera remplacé par EventBridge + SQS (étapes C à F)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - backend-net

  # ================== POINT D'ENTRÉE (joue le rôle d'API Gateway en local) ==================
  localstack:
    image: localstack/localstack:4.0
    container_name: localstack
    environment:
      - SERVICES=sqs,events
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name cart-queue"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend-net
  api-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    ports:
      - "8081:80"            # on garde le port 8081 : les mêmes commandes curl qu'avant fonctionnent
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - product-service
      - inventory-service
      - cart-service
      - order-service
      - payment-service
    networks:
      - backend-net

  # ================== MICROSERVICES ==================

  auth-service:
    image: auth-service:latest
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_service_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  user-service:
    image: user-service:latest
    build: ./user-service
    container_name: user-service
    ports:
      - "8090:8090"
    environment:
      - SERVER_PORT=8090
      - SPRING_APPLICATION_NAME=user-service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/userdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  product-service:
    image: product-service:latest
    build: ./product-service
    container_name: product-service
    ports:
      - "8091:8091"
    environment:
      - SERVER_PORT=8091
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_ecommerce_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  inventory-service:
    image: inventory-service:latest
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8092:8092"
    environment:
      - SERVER_PORT=8092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventorydb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  cart-service:
    image: cart-service:latest
    build: ./cart-service
    container_name: cart-service
    ports:
      - "8093:8093"
    environment:
      - SERVER_PORT=8093
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  order-service:
    image: order-service:latest
    build: ./order-service
    container_name: order-service
    ports:
      - "8094:8094"
    environment:
      - SERVER_PORT=8094
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  payment-service:
    image: payment-service:latest
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8097:8097"
    environment:
      - SERVER_PORT=8097
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  notification-service:
    image: notification-service:latest
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8098:8098"
    environment:
      - SERVER_PORT=8098
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  pgdata: